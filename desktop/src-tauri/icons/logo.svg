<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6cb8ff"/>
      <stop offset="0.55" stop-color="#7fb0e8"/>
      <stop offset="1" stop-color="#ffc65e"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2130"/>
      <stop offset="1" stop-color="#0c0e13"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.4" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- squircle background -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <!-- elephant (front-facing) -->
  <g fill="url(#g)">
    <ellipse cx="298" cy="450" rx="180" ry="212"/>
    <ellipse cx="726" cy="450" rx="180" ry="212"/>
    <ellipse cx="512" cy="452" rx="256" ry="268"/>
    <path d="M512 566
             C 512 704, 454 772, 496 872
             C 514 916, 566 912, 578 866
             C 566 812, 602 762, 602 700
             C 602 636, 566 596, 512 566 Z"/>
  </g>

  <!-- soft top sheen for depth -->
  <ellipse cx="512" cy="452" rx="256" ry="268" fill="url(#sheen)"/>

  <!-- inner ears: subtle light highlight (not muddy) -->
  <ellipse cx="298" cy="466" rx="112" ry="140" fill="#ffffff" opacity="0.14"/>
  <ellipse cx="726" cy="466" rx="112" ry="140" fill="#ffffff" opacity="0.14"/>

  <!-- eyes -->
  <circle cx="424" cy="428" r="31" fill="#12151d"/>
  <circle cx="600" cy="428" r="31" fill="#12151d"/>
  <circle cx="434" cy="418" r="10" fill="#ffffff"/>
  <circle cx="610" cy="418" r="10" fill="#ffffff"/>

  <!-- tusks -->
  <path d="M456 640 C 440 704, 444 744, 466 762 C 474 738, 472 690, 472 650 Z" fill="#ffffff"/>
  <path d="M568 640 C 584 704, 580 744, 558 762 C 550 738, 552 690, 552 650 Z" fill="#ffffff"/>
</svg>
