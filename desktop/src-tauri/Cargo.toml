[package]
name = "tusk"
version = "0.1.6"
edition = "2021"
description = "Tusk — a free, open-source local dev environment for macOS"
authors = ["getsettalk"]
license = "MIT"
repository = "https://github.com/getsettalk/tusk"

# The Tauri app is a plain desktop binary; frontend assets in ../ui are
# embedded at build time by tauri-build (frontendDist in tauri.conf.json).

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
# Faster incremental dev builds.
incremental = true
